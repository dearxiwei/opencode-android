plugins {
    id 'com.android.application'
}

android {
    namespace 'com.opencode.launcher'
    compileSdk 34

    defaultConfig {
        // Paquete propio de la app v2: convive instalada con la v1 (.next).
        // Ya no es un "launcher": el id publico es com.opencode.android.
        applicationId "com.opencode.android"
        minSdk 26
        targetSdk 34
        versionCode 182
        versionName "5.0.3"
        buildConfigField "int", "SERVER_PORT", "4099"
        // Version del binario empaquetado en jniLibs. Actualizarla al cambiarlo.
        buildConfigField "String", "OPENCODE_VERSION", "\"2.2.0\""
        // v2: runtime 2.x con la UI nueva (viewport, service worker, avisos).
        buildConfigField "boolean", "V2", "true"
        // Aislamiento del laboratorio. En la app real va en false: updates
        // del launcher y auto-permisos activos.
        buildConfigField "boolean", "V2_LAB", "false"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Firma release: lee keystore.properties (no versionado). Sin ese fichero,
    // el debug compila igual; el release pedirÃ¡ el keystore.
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file("keystore.properties")
    if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                storeType keystoreProps['storeType'] ?: 'PKCS12'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        // App 5.x: RC con la clave de release y el paquete definitivo.
        beta {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField "int", "SERVER_PORT", "4099"
            signingConfig signingConfigs.release
        }
        // Build de pruebas separado para no tocar la app instalada.
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "int", "SERVER_PORT", "4100"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
}

// 官方发布包里的工具链(.deb)和 opencode 运行时二进制不在仓库里（见 .gitignore）：
// 构建前从官方 v5.0.3 APK 中取出，避免打出的 APK 缺少资源导致首次启动卡在安装工具链。
def bundledToolboxDir = file("$projectDir/src/main/assets/toolbox")
def bundledRuntimeBin = file("$projectDir/src/main/jniLibs/arm64-v8a/libopencode2_bin.so")

tasks.register("fetchBundledRuntime") {
    outputs.dir(bundledToolboxDir)
    outputs.file(bundledRuntimeBin)
    doLast {
        if (bundledRuntimeBin.exists() && bundledToolboxDir.exists()
                && (bundledToolboxDir.listFiles()?.length ?: 0) > 0) {
            println "bundled runtime/toolbox already present, skip download"
            return
        }
        def url = "https://github.com/Dajeovv/opencode-android/releases/download/v5.0.3/OpenCodeAndroid-v5.0.3.apk"
        def tmp = new File(buildDir, "tmp/upstream-v5.0.3.apk")
        tmp.parentFile.mkdirs()
        println "Downloading upstream APK: " + url
        new URL(url).withInputStream { input -> tmp.withOutputStream { out -> out << input } }
        println "Extracting toolbox + runtime from upstream APK"
        def zip = new java.util.zip.ZipFile(tmp)
        try {
            zip.entries().each { e ->
                def name = e.name
                if (name.startsWith("assets/toolbox/")) {
                    def out = new File(bundledToolboxDir, name.substring("assets/toolbox/".length()))
                    if (out.isDirectory()) return
                    out.parentFile.mkdirs()
                    zip.getInputStream(e).withStream { input -> out.withOutputStream { o -> o << input } }
                } else if (name == "lib/arm64-v8a/libopencode2_bin.so") {
                    bundledRuntimeBin.parentFile.mkdirs()
                    zip.getInputStream(e).withStream { input -> bundledRuntimeBin.withOutputStream { o -> o << input } }
                }
            }
        } finally {
            zip.close()
        }
        tmp.delete()

        println "Bundled resources ready"
    }
}

tasks.configureEach { t ->
    if (t.name == "preBuild") t.dependsOn("fetchBundledRuntime")
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Descompresion xz en Java: Android no trae el binario xz y el tar de
    // Toybox lo necesita para los .deb de Termux.
    implementation 'org.tukaani:xz:1.10'
}
